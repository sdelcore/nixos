# Source common configuration
source = common.conf
exec-once = systemctl --user daemon-reload && systemctl --user restart voiced.service 2>/dev/null || true
exec-once = voiced desktop --hidden
bind = $mainMod, R, exec, voiced toggle
bind = $mainMod SHIFT, R, exec, voiced assistant-start
bindr = $mainMod SHIFT, R, exec, voiced assistant-stop

# Common configuration provides the remote client voice bindings for both hosts.

# Set workspace to specific monitor - Laptop configuration
workspace = 1, monitor:DP-7, layoutopt:orientation:left
workspace = 2, monitor:DP-9, layoutopt:orientation:center
workspace = 3, monitor:DP-8, layoutopt:orientation:left
workspace = 4, monitor:DP-7, layoutopt:orientation:left
workspace = 5, monitor:DP-9, layoutopt:orientation:center
workspace = 6, monitor:DP-8, layoutopt:orientation:left
workspace = 7, monitor:DP-9, layoutopt:orientation:center
workspace = 8, monitor:DP-9, layoutopt:orientation:center
workspace = 9, monitor:DP-9, layoutopt:orientation:center