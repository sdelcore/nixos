source = common.conf
exec-once = systemctl --user start polkit-gnome-authentication-agent-1.service
# Use Lab-installed alternatives for workstation-only applications.
unbind = $mainMod SHIFT, B
bind = $mainMod SHIFT, B, exec, chromium
unbind = $mainMod SHIFT, F
bind = $mainMod SHIFT, F, exec, thunar
unbind = $mainMod, A
bind = $mainMod, A, exec, rofi -show drun
unbind = $mainMod, Space
bind = $mainMod, Space, exec, rofi -show drun

